[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-workflows"
dynamic = ["version"]
description = "Set up, run and follow Quantum ESPRESSO and Yambo calculations on Slurm clusters from a desktop GUI"
readme = "README.md"
# The same license as Visual Excitons and YamboPy
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "jmcastelo", email = "jm.castelo@uv.es" }]
# 3.11: tomllib, to read cluster profiles and projects (TOML)
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Development Status :: 2 - Pre-Alpha",
]
# Lower bounds: versions the code is known to work with. Phase 1 needs only
# these; ASE, spglib and YamboPy come with the input builders (phases 3-4)
dependencies = [
    # Only the essential Qt modules, as in Visual Excitons
    "PySide6-Essentials>=6.8",
    # SSH sessions, commands and SFTP; bcrypt reads encrypted OpenSSH-format
    # keys (the default of ssh-keygen)
    "asyncssh[bcrypt]>=2.17",
    "qasync>=0.27",       # asyncio event loop inside Qt's
    "keyring>=25",        # passwords and key passphrases in the OS keyring
    "tomli-w>=1.0",       # writing TOML (reading is tomllib)
    # QE inputs (Phase 3): structure files, symmetry, k-points
    "ase>=3.23",          # reading structures (CIF, POSCAR, XYZ, QE inputs and outputs...)
    "spglib>=2.4",        # space groups, primitive cells, irreducible k-points
    "numpy>=1.26",
    "pyqtgraph>=0.13",    # the plots (the Bands window), as Visual Excitons'
    # The fork of YamboPy with the Brillouin-zone tools (BrillouinZone,
    # lattice_data_for_cell), as Visual Excitons: the official package lacks them
    "yambopy @ git+https://github.com/jmcastelo/yambopy.git@ase-bz",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4", "pytest-asyncio>=0.24"]

[project.scripts]
vwf = "visual_workflows.cli:main"

[project.gui-scripts]
visual-workflows = "visual_workflows.gui.main:main"

[project.urls]
Homepage = "https://github.com/jmcastelo/visual-workflows"

[tool.setuptools.dynamic]
version = { attr = "visual_workflows.__version__" }

[tool.setuptools.packages.find]
include = ["visual_workflows*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
# async tests run without a decorator each
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "cluster: needs a reachable Slurm cluster (the Docker test cluster or a real one); skipped otherwise",
    "live: read-only checks of a real cluster profile (pytest -m live --cluster NAME); skipped otherwise",
]
filterwarnings = [
    # qasync uses asyncio.iscoroutinefunction, deprecated in Python 3.14
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:qasync",
]
